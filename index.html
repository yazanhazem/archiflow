<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fa" />
    <meta name="description" content="A considered workspace for architecture studios. Organize projects, phases, deadlines, and the conversations that move your work forward." />
    <title>Archiflow — Architecture studio workspace</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      (() => {
        let choice;
        try { choice = localStorage.getItem('studio-theme'); } catch {}
        const dark = choice === 'dark' || (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        const root = document.documentElement;
        root.dataset.theme = dark ? 'dark' : 'light';
        root.style.colorScheme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#141b23' : '#f3f6f9';
      })();
    </script>
    <style>html { background: #f3f6f9; } html[data-theme="dark"] { background: #141b23; }</style>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
